name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Lint the app
        run: npm run lint
      - name: Lint tests, e2e and tools
        run: npx eslint tests e2e tools jest.config.js playwright.config.js --quiet
      - name: Syntax-check the PHP backend
        run: find php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: npm test
      - name: Unit tests with the coverage floor
        run: npm run test:coverage
      - name: Install the browser for e2e
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
